<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="手机可用的本地英语词汇与阅读训练工具"
    />
    <meta name="theme-color" content="#173c35" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="滴水英语" />
    <meta name="format-detection" content="telephone=no" />
    <title>滴水英语 · 手机学习</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <noscript>这个应用需要启用 JavaScript。</noscript>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script>
      window.addEventListener("error", (event) => {
        const app = document.querySelector("#app");
        if (app && app.querySelector(".loading")) {
          app.innerHTML =
            '<div class="loading"><div><div class="loading-mark">!</div>' +
            '<div>启动失败：' +
            String(event.message || "未知脚本错误").replace(/[<>&]/g, "") +
            '</div><div class="muted" style="margin-top:10px">请确认通过本地服务器打开。</div></div></div>';
        }
      });
      window.addEventListener("unhandledrejection", (event) => {
        const message = event.reason?.message || String(event.reason || "未知异步错误");
        const app = document.querySelector("#app");
        if (app && app.querySelector(".loading")) {
          app.innerHTML =
            '<div class="loading"><div><div class="loading-mark">!</div>' +
            '<div>启动失败：' +
            message.replace(/[<>&]/g, "") +
            '</div><div class="muted" style="margin-top:10px">请确认通过本地服务器打开。</div></div></div>';
        }
      });
    </script>
    <script type="module" src="app.js"></script>
  </body>
</html>
